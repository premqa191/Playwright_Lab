name: Playwright Docker CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. గిట్‌హబ్ నుండి కోడ్‌ను క్లౌడ్ సర్వర్‌లోకి డౌన్‌లోడ్ చేసుకోవడం
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. డాకర్ కంపోజ్ ద్వారా క్లౌడ్ కంటైనర్‌లో ప్లేరైట్ టెస్టులను రన్ చేయడం
      - name: Run Playwright Tests via Docker Compose
        run: docker compose up --abort-on-container-exit

      # 3. టెస్ట్ ఫెయిల్ అయినా లేదా పాస్ అయినా HTML రిపోర్ట్ / స్క్రీన్‌షాట్‌లను ఆర్టిఫాక్ట్‌గా సేవ్‌ చేయడం
      - name: Upload Test Report & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-execution-report
          path: reports/